name: Add a post

# For content editors who would rather not touch files directly.
# Go to the Actions tab → "Add a post" → "Run workflow", fill in the form, and
# this creates the Markdown file for you and publishes it.

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "What are you adding?"
        type: choice
        required: true
        default: news
        options: [news, research]
      title:
        description: "Title"
        type: string
        required: true
      summary:
        description: "One or two sentences for the list page"
        type: string
        required: true
      body:
        description: "The text of the post (Markdown; use \\n for a new paragraph)"
        type: string
        required: true
      date:
        description: "Date as YYYY-MM-DD (news only; leave empty for today)"
        type: string
        required: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the file
        id: write
        env:
          KIND: ${{ inputs.kind }}
          TITLE: ${{ inputs.title }}
          SUMMARY: ${{ inputs.summary }}
          BODY: ${{ inputs.body }}
          DATE: ${{ inputs.date }}
        run: python3 .github/scripts/new_post.py >> "$GITHUB_OUTPUT"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "content: add ${{ inputs.kind }} post — ${{ inputs.title }}"
          git push

      - name: Summary
        run: |
          echo "Created \`${{ steps.write.outputs.path }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The site rebuilds automatically; it is usually live in a couple of minutes." >> "$GITHUB_STEP_SUMMARY"
