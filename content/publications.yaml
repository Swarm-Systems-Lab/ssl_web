# Publications.
#
# Papers live in four lists. Which one a paper belongs in:
#
#   journal:     published in a journal
#   conference:  published in conference proceedings
#   preprint:    written up and submitted, still under review
#   technote:    on arXiv, and not headed for a journal
#
# Add a new paper at the TOP of its list and give it the next reference number
# (J.. journals, C.. conferences, U.. under review, T.. tech notes).
#
# The page shows them in three blocks: everything under review first, then the
# published work by year, then the tech notes. Work under review keeps a
# `year:` - the year it was submitted - but is not filed under it.
#
#   - ref: J28
#     authors: "A. Author, B. Author, HG de Marina"
#     title: "The title of the paper"
#     venue: "IEEE Transactions on Automatic Control"
#     year: 2026                   # leave out for something still in review
#     doi: 10.1109/TAC.2025.123456          # the record at the publisher
#     pdf: https://arxiv.org/pdf/2410.15921 # an openly readable full text
#     note: "Optional line shown in accent type, e.g. an award"
#     abstract: "Shown on the paper's own page. Links work here."
#     image: images/publications/j28.jpg    # thumbnail, relative to content/
#     imageAlt: "What the picture shows"
#     links:                               # anything else: a video, code, data
#       - label: Video
#         href: https://...
#     bibtex: |
#       @article{author2026title,
#         title = {The title of the paper},
#       }
#
# `doi` and `pdf` are the two nearly every paper has, so they get their own
# fields and are always shown first, in that order. Everything else goes under
# `links` and is listed alphabetically after them.
#
# You do not have to find them by hand. Run
#
#     bun run publications:enrich
#
# and any missing `doi` and `pdf` are looked up from OpenAlex and arXiv and
# written into this file. It never changes a line you wrote yourself.
#
# Every paper also gets its own page at /publications/<title-as-a-slug>.
# The page groups by year; the buttons at the top filter by list, so do not
# repeat the year inside `venue`.

