# Publications.
#
# Papers live in four lists — `journal:`, `conference:`, `preprint:`, and
# `technote:`. Add a new paper at the TOP of its list and give it the next
# reference number (J.. for journals, C.. for conferences, U.. for preprints,
# T.. for tech notes).
#
#   - ref: J28
#     authors: "A. Author, B. Author, HG de Marina"
#     title: "The title of the paper"
#     venue: "IEEE Transactions on Automatic Control"
#     year: 2026                   # leave out for something still in review
#     note: "Optional line shown in accent type, e.g. an award"
#     abstract: "Shown on the paper's own page. Links work here."
#     image: images/publications/j28.jpg    # thumbnail, relative to content/
#     imageAlt: "What the picture shows"
#     links:
#       - label: PDF
#         href: https://...
#       - label: DOI
#         href: https://doi.org/...
#     bibtex: |
#       @article{author2026title,
#         title = {The title of the paper},
#       }
#
# Every paper also gets its own page at /publications/<title-as-a-slug>.
# The page groups by year; the buttons at the top filter by list, so do not
# repeat the year inside `venue`.

