# What each picture and clip in this folder is, and how it is framed.
#
# Every item on the media page takes its caption from here. The file name sets
# the date and the order, and nothing else: a caption read off a file name
# could not be translated, and a folder of files named in English is not a
# thing a second language can be added to.
#
# So a file with no caption below stops the build, naming it. Adding a picture
# is still a drag into this folder, plus the line that says what it is.

