# Site-wide settings. Editing this file changes the header, footer, the front
# page, and the default text search engines and social networks show.

title: Swarm Systems Lab
shortTitle: Swarm Systems Lab
tagline: Control theory and emergent behaviour in robot swarms
description: >-
  The Swarm Systems Lab at the University of Granada works on swarm robotics and
  autonomous systems, where control theory and emergent behaviour converge — with
  swarms of fixed-wing aircraft, rotorcraft, rovers, and other autonomous robots.

institution: University of Granada
email: swarmsystemslab@gmail.com

# Every page can have a picture across the top. Drop a file in content/covers/
# named after the page — home.png, news.jpg, team.jpg, join-us.jpg — and it
# appears. Captions are optional; without one the picture still shows.
coverCaptions:
  home: "The Swarm Systems Lab"
  # news: "Field testing near Granada"

# The tabs in the header, in order.
# To add a new tab: create the page in src/pages/, then add a line here.
# A tab with `children` becomes a drop-down; the tab itself still links to
# `href`, so it keeps working without JavaScript.
nav:
  - label: News
    href: /news
  - label: Research
    href: /research
  - label: Publications
    href: /publications
  - label: Team
    href: /team
  - label: Join us
    href: /join-us
    children:
      - label: Open positions
        href: /join-us#positions
      - label: Student projects
        href: /join-us#projects
  - label: Awards
    href: /awards
  - label: Media
    href: /media

# Featured on the front page with a description, and in the footer.
community:
  - label: GitHub
    href: https://github.com/Swarm-Systems-Lab
    description: >-
      Our code in the open. The Swarm Systems Lab's Python simulation 
      environment used for the numerical validation of our published work.
  - label: YouTube
    href: https://www.youtube.com/@SwarmSystemsLab
    description: >-
      Field footage, conference presentations, and research videos from the lab.
  - label: Discord
    href: https://discord.gg/peMNWpe4YT
    description: >-
      Whether you are a seasoned researcher or just starting to explore swarm 
      robotics, join us on Discord to exchange ideas, discuss research, and share 
      experiences on autonomous swarms.

# Links shown in the footer.
social:
  - label: GitHub
    href: https://github.com/Swarm-Systems-Lab
  - label: YouTube
    href: https://www.youtube.com/@SwarmSystemsLab
  - label: Discord
    href: https://discord.gg/peMNWpe4YT
