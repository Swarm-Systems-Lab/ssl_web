fleet:
  seo:
    title: Fleet
    description: The robots the Swarm Systems Lab flies and drives.
  header:
    eyebrow: What we fly
    title: THE FLEET.
    accent: FLEET.
    intro: >-
      The machines the lab works with, and what each one is for. Nothing here
      runs on motion capture: indoors the robots localize off each other with
      aerosense - anchors added only when a room-fixed frame is wanted - and run
      perception onboard. Outdoors the same stack gains GPS where there is any,
      and camera SLAM.
  after:
    - note: >-
        * Endurance is measured using LiPo batteries. Different battery
        chemistries (e.g., Li-ion) may considerably improve these values when
        endurance is primarily limited by energy capacity rather than peak
        power/current capability.
  labels:
    empty: >-
      Nothing here yet. Copy content/fleet/_template/, name the copy after a
      machine, and it appears.

