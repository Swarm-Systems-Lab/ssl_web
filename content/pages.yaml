# The words on every page, in one place.
#
# One block per page. Nothing here is code, and nothing in the pages is text:
# a translation is a copy of this file with the values rewritten, and no .astro
# has to be opened for it.
#
#   seo      what the browser tab and search results say
#   header   the block at the top of the page
#   before   prose shown above the page's own content
#   after    prose shown below it
#   labels   single words and lines the page's own parts need, by name
#
# `before` and `after` take any number of these, in the order written:
#
#   - heading: A labelled divider
#   - note: Small print, under a rule.
#   - prose: An ordinary paragraph.
#
# All three work on any page, so adding a footnote to the news page - or a
# paragraph to the front page - is a few lines here and nothing else. `labels`
# is a free-form map for the same reason: a new page, or a new line on an old
# one, never needs the schema in src/lib/data.ts changed.
#
# Links, **bold**, *italics* and `code` work in any of these.

home:
  # The front page is titled after the site itself - see site.yaml. Its opening
  # paragraphs are content/pages/home.md; these are the words around them.
  labels:
    research: Our research →
    join: Join us
    affiliations: Our institutions and funders
    # "Open GitHub →", once per community link.
    open: Open
    media: All photos and videos →
    news: Latest news
    newsIntro: Papers, visits, field tests, and milestones from the lab.
    allNews: Read all news →
    elsewhere: Find us elsewhere

