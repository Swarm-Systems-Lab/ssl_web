# Settings for the media page itself.
#
# The media it shows lives in content/media/ - photos, GIFs and clips are the
# files in that folder, and the YouTube videos are declared in its media.yaml.
# Nothing about an individual picture or video belongs here.

intro: Field tests, prototypes, and life around the lab. Long videos live on our YouTube channel.

# How many photos to show per page. The rest move to /media/2, /media/3, ...
perPage: 24

# Our YouTube channel, linked at the top of the media page.
channel:
  href: https://www.youtube.com/@SwarmSystemsLab
  label: "@SwarmSystemsLab"
  description: >-
    Every video we publish, including the long cuts that do not fit on this page.
