# Master (TFM) and bachelor (TFG) projects offered to students.
# These appear at Join us -> Student projects.
#
# Named student-projects rather than projects because the lab's own projects -
# the simulator, the autopilot, the tutorials - are a different thing.
#
#   - title: What the project is
#     level: TFM | TFG | TFG / TFM
#     summary: One paragraph. Links work - [Paparazzi](https://paparazziuav.org).
#     requirements:
#       - ...
#     image: images/projects/geolocalisation.jpg   # optional, relative to content/
#     imageAlt: "What the picture shows"

items:
  - title: Onboard geolocalisation of a fixed-wing aircraft
    level: TFM
    image: images/student-projects/loc.png
    summary: >-
      Within the topic of autonomous navigation for fixed-wing aircraft. The
      project takes photos from the sky and compares them against a dataset to
      recover the vehicle's latitude and longitude. Everything runs onboard.
    requirements:
      - Python, C and/or C++ for embedded systems - the solution runs on a Jetson coordinating with the autopilot microcontroller.
      - Real-time image processing.
      - Comfortable with maths and physics.

  - title: Guiding vector fields
    level: TFG / TFM
    image: images/student-projects/pprz.png
    summary: >-
      Coordinating different aerial vehicles through guiding vector fields,
      within [Palomo](/projects/palomo), our autopilot. Depending on the
      candidate this is offered as a bachelor's or a master's project.
    requirements:
      - C and/or C++ for embedded systems - the solution must run onboard.
      - Good skills in differential equations, geometry, and physics.

  - title: Data representation and post-processing tools
    level: TFG
    image: images/student-projects/vista.png
    summary: >-
      Front-end development for the data analysis of our experiments and flights
      with robot swarms. We generate a lot of data and need automated tools to
      represent and interact with it.
    requirements:
      - Python (Matplotlib, Qt), focusing on the front end.

  - title: Implementation of distributed algorithms over wireless networks
    level: TFG
    image: images/student-projects/uwb.jpg
    summary: >-
      Coordinating robot swarms over wireless networks. Want to know how the
      "magic" of networked robot coordination actually works? You will learn both
      the theoretical foundations and their embedded implementation.
    requirements:
      - Comfortable with linear algebra.
      - C for embedded systems.
