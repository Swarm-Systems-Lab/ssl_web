# Awards, grants, and distinctions.
#
# Add a new entry anywhere in the list - the page sorts by year, newest first.
#
#   - title: What was awarded
#     awarder: Who awarded it
#     year: 2026
#     detail: Optional extra sentence. Links work here - [like this](https://…).
#     members: [hector-garcia-de-marina]   # file names from content/team/
#     image: images/awards/erc.jpg         # one picture, relative to content/
#     images:                              # or several, shown as a carousel
#       - images/awards/erc.jpg
#       - images/awards/ceremony.jpg
#     imageAlt: "What the picture shows"
#     plate: true                          # force the white ground on or off
#     links:                               # optional references
#       - label: Project
#         href: https://...
#
# A name in `members` that matches a file in content/team/ becomes a link to
# that person; anything else is shown as plain text.

